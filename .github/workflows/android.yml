# Builds the Cambista APK on GitHub's computers. Nothing to install on yours.
#
# - Every push to main: tests + APK, downloadable from the run page ("Artifacts").
# - A tag like v0.1.0: same, plus a GitHub Release with the APK attached (easy to open on the phone).
# - "Run workflow" on main with "Publish a release" ticked: same as a tag. It creates the tag
#   v<version in package.json> itself, so no tag has to be pushed by hand.
# - With the 4 CAMBISTA_* secrets set, the APK is signed with your own key, so new versions install
#   over old ones without losing data. Without them you get a debug APK.
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release tagged v<version in package.json> (main only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0b0d' --iconBackgroundColorDark '#0b0b0d' --splashBackgroundColor '#0b0b0d' --splashBackgroundColorDark '#0b0b0d'
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMBISTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cambista.jks"
            echo "path=$RUNNER_TEMP/cambista.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          CAMBISTA_KEYSTORE: ${{ steps.key.outputs.path }}
          CAMBISTA_KEYSTORE_PASSWORD: ${{ secrets.CAMBISTA_KEYSTORE_PASSWORD }}
          CAMBISTA_KEY_ALIAS: ${{ secrets.CAMBISTA_KEY_ALIAS }}
          CAMBISTA_KEY_PASSWORD: ${{ secrets.CAMBISTA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../out
          if [ -n "$CAMBISTA_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../out/Cambista.apk
            cp app/build/outputs/bundle/release/app-release.aab ../out/Cambista-playstore.aab
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../out/Cambista-debug.apk
          fi
          ls -la ../out

      - uses: actions/upload-artifact@v7
        with:
          name: Cambista-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Publish release (tags, or "Run workflow" on main with release ticked)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
          generate_release_notes: true
