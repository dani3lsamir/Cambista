# Builds the Cambista APK on GitHub's computers. Nothing to install on yours.
#
# - Every push to main: tests + APK, downloadable from the run page ("Artifacts").
# - A tag like v0.1.0: same, plus a GitHub Release with the APK attached (easy to open on the phone).
# - With the 4 CAMBISTA_* secrets set, the APK is signed with your own key, so new versions install
#   over old ones without losing data. Without them you get a debug APK.
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0b0d' --iconBackgroundColorDark '#0b0b0d' --splashBackgroundColor '#0b0b0d' --splashBackgroundColorDark '#0b0b0d'
          node scripts/prepare-android.mjs
          npx cap sync android

      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMBISTA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cambista.jks"
            echo "path=$RUNNER_TEMP/cambista.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          CAMBISTA_KEYSTORE: ${{ steps.key.outputs.path }}
          CAMBISTA_KEYSTORE_PASSWORD: ${{ secrets.CAMBISTA_KEYSTORE_PASSWORD }}
          CAMBISTA_KEY_ALIAS: ${{ secrets.CAMBISTA_KEY_ALIAS }}
          CAMBISTA_KEY_PASSWORD: ${{ secrets.CAMBISTA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ../out
          if [ -n "$CAMBISTA_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../out/Cambista.apk
            cp app/build/outputs/bundle/release/app-release.aab ../out/Cambista-playstore.aab
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../out/Cambista-debug.apk
          fi
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: Cambista-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
