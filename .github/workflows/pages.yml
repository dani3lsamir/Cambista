name: Cambista Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/core/rates-core.js'
      - 'src/demo.js'
      - 'src/i18n.js'
      - 'resources/icon.svg'
      - 'scripts/collect-market.mjs'
      - 'vite.config.js'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: cambista-pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web

      - name: Check out the stored market history
        run: |
          DATA_DIR="$RUNNER_TEMP/cambista-market"
          if git ls-remote --exit-code origin refs/heads/pages-data; then
            git fetch --depth=1 origin refs/heads/pages-data
            git worktree add --detach "$DATA_DIR" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --detach "$DATA_DIR" HEAD
            git -C "$DATA_DIR" switch --orphan pages-data-initial
          fi

      - name: Collect rates and persist the history
        run: |
          DATA_DIR="$RUNNER_TEMP/cambista-market"
          node scripts/collect-market.mjs "$DATA_DIR/market.json"
          git -C "$DATA_DIR" add market.json
          if ! git -C "$DATA_DIR" diff --cached --quiet; then
            git -C "$DATA_DIR" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update exchange rate observations'
            git push origin "$(git -C "$DATA_DIR" rev-parse HEAD):refs/heads/pages-data"
          fi
          install -D "$DATA_DIR/market.json" dist-web/data/market.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
